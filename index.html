```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venkat Sai Foodies</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            /* YOUR BACKGROUND IMAGE */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("2abc5565-81e9-42bb-a18b-3d2e79453423.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: white;
        }


        /* MAIN CONTENT */

        .hero {

            width: 90%;

            max-width: 900px;

            padding: 40px 20px;

        }


        .brand {

            font-size: 55px;

            font-weight: bold;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.7);

            margin-bottom: 15px;

        }


        .tagline {

            font-size: 30px;

            font-weight: 500;

            margin-bottom: 40px;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, 0.7);

        }


        /* ORDER NOW BUTTON */

        .order-btn {

            display: inline-block;

            padding: 17px 48px;

            background: #e67e22;

            color: white;

            text-decoration: none;

            font-size: 21px;

            font-weight: bold;

            border-radius: 35px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.4);

            transition: all 0.3s ease;

        }


        .order-btn:hover {

            transform: translateY(-4px) scale(1.04);

            background: #d35400;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.5);

        }


        /* MOBILE */

        @media (max-width: 600px) {

            .brand {

                font-size: 36px;

            }

            .tagline {

                font-size: 22px;

                margin-bottom: 30px;

            }

            .order-btn {

                padding: 15px 38px;

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


    <div class="hero">

        <div class="brand">
            VENKAT SAI FOODIES
        </div>


        <div class="tagline">
            Taste Every Bite
        </div>


        <a
            href="menu.html"
            class="order-btn"
        >
            ORDER NOW
        </a>

    </div>


</body>

</html>

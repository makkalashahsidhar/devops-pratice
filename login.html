<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Venkat Sai Foodies</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;
      background:#fff8f0;
    }

    .login-box{
      text-align:center;
      padding:50px;
      border-radius:20px;
      background:white;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
      width:350px;
    }

    h1{
      color:#b22222;
      font-size:40px;
      margin-bottom:10px;
    }

    p{
      color:#555;
      margin-bottom:30px;
      font-size:18px;
    }

    .login-btn{
      width:100%;
      padding:20px;
      border:none;
      border-radius:12px;
      background:#ff9800;
      color:white;
      font-size:28px;
      font-weight:bold;
      cursor:pointer;
    }

    .login-btn:hover{
      background:#e68900;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Login</h1>
    <p>Welcome to Venkat Sai Foodies</p>
    <button class="login-btn">LOGIN</button>
  </div>

</body>
</html>

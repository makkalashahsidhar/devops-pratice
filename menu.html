<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Menu - Venkat Sai Foodies</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.30),
                    rgba(0,0,0,0.30)
                ),
                url("file:///C:/Users/pooja/Downloads/2abc5565-81e9-42bb-a18b-3d2e79453423.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: white;

        }


        /* HEADER */

        header {

            background:
                rgba(139,30,15,0.90);

            text-align: center;

            padding: 30px 20px;

        }

        header h1 {

            font-size: 40px;

            margin-bottom: 8px;

        }

        header p {

            font-size: 18px;

        }


        /* MENU BOX */

        .menu-box {

            width: 90%;

            max-width: 600px;

            margin: 50px auto;

            padding: 35px 25px;

            background:
                rgba(255,255,255,0.94);

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.35);

        }


        .menu-box h2 {

            color: #8b1e0f;

            font-size: 36px;

            margin-bottom: 10px;

        }


        .menu-box p {

            color: #555;

            margin-bottom: 30px;

            font-size: 17px;

        }


        /* VERTICAL BUTTONS */

        .menu-buttons {

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        .menu-button {

            display: block;

            padding: 22px;

            border-radius: 18px;

            color: white;

            text-decoration: none;

            font-size: 24px;

            font-weight: bold;

            box-shadow:
                0 6px 15px rgba(0,0,0,0.25);

            transition: 0.3s;

        }


        .menu-button:hover {

            transform:
                translateY(-5px);

        }


        /* SWEETS */

        .sweets {

            background:
                linear-gradient(
                    135deg,
                    #c0392b,
                    #e67e22
                );

        }


        /* NON VEG */

        .nonveg {

            background:
                linear-gradient(
                    135deg,
                    #741b0c,
                    #b83220
                );

        }


        /* VEG */

        .veg {

            background:
                linear-gradient(
                    135deg,
                    #247a35,
                    #4caf50
                );

        }


        /* BACK */

        .back {

            display: inline-block;

            margin-top: 25px;

            padding: 12px 25px;

            border: 2px solid #8b1e0f;

            border-radius: 25px;

            color: #8b1e0f;

            text-decoration: none;

            font-weight: bold;

        }


        .back:hover {

            background: #8b1e0f;

            color: white;

        }


        /* FOOTER */

        footer {

            text-align: center;

            padding: 20px;

            background:
                rgba(59,31,15,0.95);

        }


        @media (max-width:600px) {

            header h1 {
                font-size: 30px;
            }

            .menu-box h2 {
                font-size: 29px;
            }

            .menu-button {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <header>

        <h1>
            🍽️ VENKAT SAI FOODIES
        </h1>

        <p>
            Homemade • Fresh • Traditional
        </p>

    </header>


    <div class="menu-box">

        <h2>
            OUR MENU
        </h2>

        <p>
            Choose what you would like to order
        </p>


        <div class="menu-buttons">


            <!-- SWEETS -->

            <a
                href="sweets.html"
                class="menu-button sweets"
            >
                🍬 SWEETS
            </a>


            <!-- NON VEG -->

            <a
                href="nonveg.html"
                class="menu-button nonveg"
            >
                🍗 NON-VEG
            </a>


            <!-- VEG -->

            <a
                href="veg.html"
                class="menu-button veg"
            >
                🥗 VEG
            </a>


        </div>


        <a
            href="index.html"
            class="back"
        >
            ← BACK
        </a>

    </div>


    <footer>

        Venkat Sai Foodies • Taste Every Bite

    </footer>


</body>

</html>

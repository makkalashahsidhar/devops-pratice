name: My First CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -s index.html
          test -s main.html
          test -s menu.html
          echo "Website files exist and are not empty!"

      - name: CI success message
        run: echo "CI pipeline is working!"

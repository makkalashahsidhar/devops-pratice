name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -s index.html
          test -s main.html
          test -s menu.html
          test -s veg.html
          test -s nonveg.html
          test -s sweets.html
          echo "All website files exist and are not empty!"

      - name: CI success
        run: echo "CI pipeline is working!"
